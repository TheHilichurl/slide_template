    let currentIndex = 0;

    function updateFooter(idx) {
      const s = STYLES[idx];
      document.getElementById('currentStyleName').textContent = s.name;
      document.getElementById('currentGenre').textContent = s.genre;
      document.getElementById('currentDesc').textContent = s.desc;
      document.getElementById('currentSwatches').innerHTML = s.swatches;
      document.getElementById('counterPill').textContent = `${String(idx + 1).padStart(2, '0')} / 20`;
      document.getElementById('styleSelect').value = s.file;

      // Update active tab
      document.querySelectorAll('.style-tab').forEach((t, i) => {
        if (i === idx) {
          t.classList.add('active');
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          t.classList.remove('active');
        }
      });
    }

    function switchSlide(filename, idx) {
      if (idx === undefined) {
        idx = STYLES.findIndex(s => s.file === filename);
        if (idx === -1) idx = 0;
      }
      currentIndex = idx;
      document.getElementById('slide-frame').src = filename;
      updateFooter(idx);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + STYLES.length) % STYLES.length;
      switchSlide(STYLES[currentIndex].file, currentIndex);
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % STYLES.length;
      switchSlide(STYLES[currentIndex].file, currentIndex);
    }

    function openCurrentSlideInNewTab() {
      window.open(STYLES[currentIndex].file, '_blank');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault(); nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault(); prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault(); toggleFullscreen();
      }
    });

    // Synchronize iframe scaling with parent container
    function scaleFrame() {
      try {
        const frame = document.getElementById('slide-frame');
        if (frame && frame.contentWindow && frame.contentWindow.updateStageScale) {
          frame.contentWindow.updateStageScale();
        }
      } catch (e) {}
    }

    const slideFrameEl = document.getElementById('slide-frame');
    slideFrameEl.addEventListener('load', () => {
      scaleFrame();
      setTimeout(scaleFrame, 60);
      setTimeout(scaleFrame, 250);
    });
    window.addEventListener('resize', scaleFrame);

    // Initialize footer
    window.addEventListener('DOMContentLoaded', () => {
      updateFooter(0);
      if (window.lucide) lucide.createIcons();
      scaleFrame();
    });
  </script>
